# Optimus model policy: reviewed defaults (ADR-004 decision 8; Plan 12.2 spec 9.2; Task 1 contracts §4).
#
# Prices are ADR-004's pinned-route USD per million tokens (input / output), 2026-09-30.
# Endpoint windows and max outputs come from the OpenRouter catalog snapshot of 2026-09-30
# (docs/decisions/2026-09-30-industry-context-cost-and-model-evidence.md, section C). They are
# recorded but NOT verified: the free drift check (tools/check_model_registry_drift.py) must confirm
# each endpoint before a route can be used. Unknown facts stay null; nothing here is guessed.
#
# Claude Haiku 5.5 (Plan 12.2 closure plan v3, operator approval of the offline scope and policy, #237
# 6249169293) is the shipped summarizer and easy model. Its entry, estimator, output reserves and roles are
# exactly the reviewed attached test profile's (test_profile_attached.yaml), so this file composes to the
# attached profile's effective hash. Its admission is its own entry's `admission` block (Plan 12.4 v7; ADR-025):
# an empirical size estimate (verified: false) and provider-family routing, each with its evidence and
# limitations, approved with the effective hash. Its receipt is the accepted assessment-v1.1 receipt for its fixture, prompt
# and validator only, not a general quality claim. No medium model is eligible yet, so the default planner
# falls back to the first eligible easy model (agent/defaults.py). A change to this file is a reviewed PR that
# also updates the SHIPPED_DEFAULTS_HASH review pin in experimental.py; a model added through the operator
# override needs no code change.
#
# This file must stay strict YAML: no anchors, aliases, merge keys or custom tags; quote dates.

schema_version: 1
policy_version: "2026-10-02.1"
fixture: false
context_ceiling_tokens: 262144
output_reserve_tokens: {implementer: 32768, summarizer: 8192}
estimators:
  haiku-5-5-empirical: {method: utf8-bytes-ratio-empirical, tokens_per_byte: "1", per_message_tokens: 16, fixed_tokens: 256, verified: false}
  # The conservative empirical default any model may name (Plan 12.4 v7 Design 1): Haiku's values, verified: false.
  conservative-utf8: {method: utf8-bytes-ratio-empirical, tokens_per_byte: "1", per_message_tokens: 16, fixed_tokens: 256, verified: false}
role_price_blends: {}
alerts:
  thresholds_usd: []

