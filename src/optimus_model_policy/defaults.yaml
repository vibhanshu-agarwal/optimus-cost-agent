# each endpoint before a route can be used. No route estimator or output reserve has been measured yet
# (D1-D3, Plan 12.2 Task 12), so this policy admits no model for any role until those are reviewed in.
# Unknown facts stay null; nothing here is guessed. Change this file only through a reviewed PR.
#
# This file must stay strict YAML: no anchors, aliases, merge keys or custom tags; quote dates.

