        prompt_digest: 6d1b4e77d77f1a7331932633dbc39ae4f1c3bf5c4a79acf8aed9873b410902db  # pragma: allowlist secret - public prompt digest
        validator: context-summary-assessment-v1.1
        request_ids: [gw-142d038d8be1423bba3a4c286f813726, gw-52fac698887f4b69b98f33ad60e0650b]  # pragma: allowlist secret - public Gateway request IDs
        recorded_on: "2026-10-10"
        result: pass
    evidence:
      - "2026-10-09 free inspection: OpenRouter endpoints/models listing, Anthropic model page; provider-family route"
      - "text_planning_grammar is a test assumption checked by Task 13's Agent cases, not a publisher fact"

