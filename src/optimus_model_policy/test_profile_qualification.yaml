# Plan 12.2 test profile "qualification" (profile A): Claude Haiku 5.5 experimental test route.
#
# Reviewed test data applied over defaults.yaml for a named test launch only; never shipped policy and
# never selected without its pinned effective hash in an HMAC-approved launch (test_profiles.py).
#
# Authority: operator release (2026-10-09) of Plan 12.2 testing on Claude Haiku 5.5 per Codex's Haiku
# disposition, with an empirical size estimate and generic Anthropic routing as test-only exceptions.
# Both exceptions are the entry's `admission` block below (Plan 12.4 v7; ADR-025), and this file's composed
# hash is pinned in test_profiles.py; a copy with any changed policy value gets the ordinary refusals.
#
# Facts from the 2026-10-09 free inspection (stage-a-haiku-inspection, MANIFEST 36080ac0...):
# - OpenRouter lists one first-party endpoint, tag "anthropic" (a base slug: provider-family routing,
#   not an exact variant), quantization literal "unknown", context 1,000,000, max output 128,000.
# - Anthropic: retirement not sooner than 2027-10-07. Prices $0.10/$0.50 per M up to 100,000 prompt
#   tokens and $0.50/$2.50 above. The registry records the HIGHER tier so every reservation is
#   conservative; reported usage and cost remain the provider's own.
# - Reasoning is optional on OpenRouter (supported efforts max, xhigh, high, medium, low); this profile
#   sets "low" explicitly rather than relying on the default.
# - The tokenizer is unpublished. The estimator is an EMPIRICAL engineering estimate: one token per
#   UTF-8 byte plus a framing allowance, checked against reported usage on every call. It stays
#   verified: false; the admission block, not the flag, admits it.
# Output reserves are the accepted closure values. Change this file only through a reviewed change that
# also re-pins its effective hash (HAIKU_QUALIFICATION_HASH in experimental.py).

output_reserve_tokens: {implementer: 32768, summarizer: 8192}

estimators:
  haiku-5-5-empirical: {method: utf8-bytes-ratio-empirical, tokens_per_byte: "1", per_message_tokens: 16, fixed_tokens: 256, verified: false}

models:
  anthropic/claude-haiku-5.5:
    origin: non-china
    tier: ultra-cheap
    prices: {input_usd_per_million: "0.50", output_usd_per_million: "2.50"}
    data_use: {provider_may_train_on_inputs: unverified, disclosure: none}
    capabilities: {native_tools: true, text_planning_grammar: true, structured_output: true, reasoning_levels: [low, medium, high, xhigh, max]}
    default_reasoning: low
    route:
      estimator: haiku-5-5-empirical
      endpoints:
        - {provider: anthropic, quantization: unknown, context_window_tokens: 1000000, max_output_tokens: 128000, verified: true, observed_on: "2026-10-09"}
    admission:
      empirical_estimate:
        evidence:
          - "2026-10-09 free inspection: the Haiku 5.5 tokenizer is unpublished"
          - "Plan 12.2 Stage C and the qualification runs checked every reply's reported prompt tokens against this estimate"
        assumptions:
          - "text-only input"
          - "one token per UTF-8 byte of message and tool text, plus 16 per message and 256 fixed, covers tokenization and framing"
        limitations:
          - "passing calls show only that the tested requests fitted, not a universal token bound"
          - "a first call can exceed its estimate, or be charged, before the per-reply check stops later calls"
          - "the router pipeline check accepts one unflagged guardrail stage (#400 option b1, ADR-026); that does not prove the request or reply unchanged, or how the guardrail handled the data"
      provider_family:
        provider: anthropic
        provider_name: Anthropic
        evidence:
          - "2026-10-09 free inspection: OpenRouter lists one first-party endpoint, tag anthropic (a base slug)"
        limitations:
          - "the base slug can reach any variant or region of Anthropic; the reply check identifies the provider, not a variant"
    # The shipped defaults carry the attached receipt (closure plan v3). Profile A states its empty receipt list so
    # it keeps composing to its reviewed pin and its summarizer stays unqualified; [] and absent dump identically.
    summary_receipts: []
    evidence:
      - "2026-10-09 free inspection: OpenRouter endpoints/models listing, Anthropic model page; provider-family route"
      - "text_planning_grammar is a test assumption checked by Task 13's Agent cases, not a publisher fact"

roles:
  easy: [anthropic/claude-haiku-5.5]
  summarizer: [anthropic/claude-haiku-5.5]
