# Plan 11.30 test profiles: exactly one cost tier per collected test (tools/testing/test_profiles.py).
# Unruled nodes are `core`. Precedence: the longest matching node rule, else the one matching path rule.
# Every rule must decide at least one collected node (tests/unit/tools/test_test_profiles.py).
schema = "test-profiles-v1"

[[rules]]
tier = "audit-current"
paths = [
  "tests/unit/acp/test_plan1126_shutdown.py",
]
why = "Plan 11.26 audit files that measure the current tree: read current sources from the repository root or spawn measurement children against it. Exceptions are node rules."

