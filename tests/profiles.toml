  "tests/unit/tools/plan1126_runtime_audit/test_historical_source.py",
]
why = "Plan 11.26 audit files that replay pinned commits (GitCommitSource / historical_source), sealed reports/plan-11-26 artifacts or seeded models of them; no current-tree read. Exceptions are node rules."

[[rules]]
tier = "core"
paths = [
