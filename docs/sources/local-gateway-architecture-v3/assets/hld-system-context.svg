<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Optimus local Gateway system context</title>
  <desc id="desc">The IDE, local agent, loopback Gateway, Redis, repository, and Phoenix are inside one developer environment. The Gateway alone contacts aggregators and public evidence services.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#365f8d"/>
    </marker>
    <style>
      .host{fill:#f5f8fc;stroke:#4976a8;stroke-width:3}
      .box{fill:#fff;stroke:#294f7c;stroke-width:2;rx:12}
      .gateway{fill:#e7f2ff;stroke:#1f6fb2;stroke-width:3;rx:12}
      .external{fill:#fff8e7;stroke:#9a6700;stroke-width:2;rx:12}
      .trace{fill:#eaf7f0;stroke:#217a55;stroke-width:2;rx:12}
      .label{font:600 19px "DejaVu Sans",sans-serif;fill:#173b6c}
      .small{font:15px "DejaVu Sans",sans-serif;fill:#27384d}
      .edge{stroke:#365f8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:8 6}
    </style>
  </defs>

  <rect class="host" x="30" y="40" width="760" height="565" rx="20"/>
  <text class="label" x="55" y="75">Developer machine / one network namespace</text>

  <rect class="box" x="70" y="115" width="185" height="78"/>
  <text class="label" text-anchor="middle" x="163" y="146">IDE / ACP client</text>
  <text class="small" text-anchor="middle" x="163" y="174">request + approval</text>

  <rect class="box" x="310" y="105" width="250" height="100"/>
  <text class="label" text-anchor="middle" x="435" y="140">Optimus local agent</text>
  <text class="small" text-anchor="middle" x="435" y="168">Gateway URL + shared secret</text>
  <text class="small" text-anchor="middle" x="435" y="190">no upstream credentials</text>

  <rect class="gateway" x="310" y="270" width="250" height="125"/>
  <text class="label" text-anchor="middle" x="435" y="304">Loopback Gateway</text>
  <text class="small" text-anchor="middle" x="435" y="332">127.0.0.1:8765</text>
  <text class="small" text-anchor="middle" x="435" y="358">policy + budget + usage</text>
  <text class="small" text-anchor="middle" x="435" y="382">aggregator key isolated</text>

  <rect class="box" x="70" y="455" width="185" height="78"/>
  <text class="label" text-anchor="middle" x="163" y="486">Repository</text>
  <text class="small" text-anchor="middle" x="163" y="514">working tree evidence</text>

  <rect class="box" x="310" y="455" width="250" height="78"/>
  <text class="label" text-anchor="middle" x="435" y="486">Redis / TimeSeries</text>
  <text class="small" text-anchor="middle" x="435" y="514">state + usage ledger</text>

  <rect class="trace" x="590" y="455" width="180" height="78"/>
  <text class="label" text-anchor="middle" x="680" y="486">Phoenix</text>
  <text class="small" text-anchor="middle" x="680" y="514">OTLP collector / UI</text>

  <rect class="external" x="850" y="105" width="300" height="92"/>
  <text class="label" text-anchor="middle" x="1000" y="138">OpenRouter</text>
  <text class="small" text-anchor="middle" x="1000" y="166">default models + deterministic search</text>

  <rect class="external" x="850" y="230" width="300" height="82"/>
  <text class="label" text-anchor="middle" x="1000" y="262">Vercel AI Gateway</text>
  <text class="small" text-anchor="middle" x="1000" y="290">optional model endpoint</text>

  <rect class="external" x="850" y="355" width="300" height="82"/>
  <text class="label" text-anchor="middle" x="1000" y="387">PyPI / npm / Maven</text>
  <text class="small" text-anchor="middle" x="1000" y="415">independent public APIs</text>

  <rect class="external" x="850" y="480" width="300" height="72"/>
  <text class="label" text-anchor="middle" x="1000" y="511">OSV</text>
  <text class="small" text-anchor="middle" x="1000" y="537">advisory service</text>

  <path class="edge" d="M255 154 H310"/>
  <path class="edge" d="M435 205 V270"/>
  <path class="edge" d="M310 494 H255"/>
  <path class="edge" d="M435 395 V455"/>
  <path class="edge" d="M560 365 H680 V455"/>
  <path class="edge" d="M560 300 H700 V150 H850"/>
  <path class="edge dash" d="M560 325 H720 V270 H850"/>
  <path class="edge" d="M560 350 H850"/>
  <path class="edge" d="M560 375 H805 V516 H850"/>

  <text class="small" text-anchor="middle" x="625" y="430">OTLP</text>
</svg>
