<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Local Gateway request and response sequence</title>
  <desc id="desc">The local agent calls the loopback Gateway. The Gateway calls an aggregator, persists usage, and exports traces to Phoenix.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#365f8d"/>
    </marker>
    <style>
      .head{fill:#173b6c;rx:10}
      .headtext{font:600 18px "DejaVu Sans",sans-serif;fill:#fff}
      .life{stroke:#98abc0;stroke-width:2;stroke-dasharray:6 6}
      .call{stroke:#365f8d;stroke-width:2.5;marker-end:url(#arrow)}
      .return{stroke:#217a55;stroke-width:2.5;marker-end:url(#arrow)}
      .trace{stroke:#7b4ba5;stroke-width:2.5;marker-end:url(#arrow)}
      .label{font:15px "DejaVu Sans",sans-serif;fill:#27384d}
      .note{fill:#fff8e7;stroke:#9a6700;stroke-width:1.5;rx:8}
    </style>
  </defs>
  <g>
    <rect class="head" x="40" y="35" width="210" height="48"/>
    <rect class="head" x="340" y="35" width="210" height="48"/>
    <rect class="head" x="650" y="35" width="210" height="48"/>
    <rect class="head" x="950" y="35" width="210" height="48"/>
    <text class="headtext" text-anchor="middle" x="145" y="66">Local agent</text>
    <text class="headtext" text-anchor="middle" x="445" y="66">Loopback Gateway</text>
    <text class="headtext" text-anchor="middle" x="755" y="66">Aggregator</text>
    <text class="headtext" text-anchor="middle" x="1055" y="66">Redis / Phoenix</text>
    <line class="life" x1="145" y1="83" x2="145" y2="560"/>
    <line class="life" x1="445" y1="83" x2="445" y2="560"/>
    <line class="life" x1="755" y1="83" x2="755" y2="560"/>
    <line class="life" x1="1055" y1="83" x2="1055" y2="560"/>
  </g>
  <line class="call" x1="145" y1="130" x2="445" y2="130"/>
  <text class="label" text-anchor="middle" x="295" y="119">Bearer shared secret + request</text>
  <rect class="note" x="365" y="155" width="160" height="52"/>
  <text class="label" text-anchor="middle" x="445" y="178">auth + policy</text>
  <text class="label" text-anchor="middle" x="445" y="198">budget precheck</text>
  <line class="call" x1="445" y1="245" x2="755" y2="245"/>
  <text class="label" text-anchor="middle" x="600" y="234">Gateway-owned credential</text>
  <line class="return" x1="755" y1="305" x2="445" y2="305"/>
  <text class="label" text-anchor="middle" x="600" y="294">output + reported usage/cost</text>
  <line class="call" x1="445" y1="365" x2="1055" y2="365"/>
  <text class="label" text-anchor="middle" x="750" y="354">persist normalized ledger record</text>
  <line class="trace" x1="445" y1="420" x2="1055" y2="420"/>
  <text class="label" text-anchor="middle" x="750" y="409">OTel span export via OTLP</text>
  <line class="return" x1="445" y1="495" x2="145" y2="495"/>
  <text class="label" text-anchor="middle" x="295" y="484">GatewayUsage + response</text>
  <text class="label" text-anchor="middle" x="600" y="550">Search uses a separate authorized request. Package and OSV routes do not depend on search.</text>
</svg>
