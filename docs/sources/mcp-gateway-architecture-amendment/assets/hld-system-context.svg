<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Optimus Gateway MCP system context</title>
  <desc id="desc">The local agent has only the Gateway URL and shared secret. The Gateway owns model and MCP credentials, trust gates, remote HTTP, and Docker-contained stdio edges. No agent-to-MCP edge exists.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#365f8d"/></marker>
    <style>
      .host{fill:#f5f8fc;stroke:#4976a8;stroke-width:3}.box{fill:#fff;stroke:#294f7c;stroke-width:2;rx:12}.gateway{fill:#e7f2ff;stroke:#1f6fb2;stroke-width:3;rx:12}.external{fill:#fff8e7;stroke:#9a6700;stroke-width:2;rx:12}.trace{fill:#eaf7f0;stroke:#217a55;stroke-width:2;rx:12}.catalog{fill:#f5f0ff;stroke:#7651a8;stroke-width:2;rx:12}.label{font:600 19px "DejaVu Sans",sans-serif;fill:#173b6c}.small{font:15px "DejaVu Sans",sans-serif;fill:#27384d}.edge{stroke:#365f8d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}.catalog-edge{stroke:#7651a8;stroke-width:2;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="host" x="30" y="40" width="820" height="680" rx="20"/>
  <text class="label" x="55" y="75">Developer machine / one network namespace</text>

  <rect class="box" x="70" y="115" width="205" height="78"/>
  <text class="label" text-anchor="middle" x="172" y="146">IDE / ACP client</text>
  <text class="small" text-anchor="middle" x="172" y="174">request + approval</text>

  <rect class="box" x="330" y="105" width="270" height="100"/>
  <text class="label" text-anchor="middle" x="465" y="140">Optimus local agent</text>
  <text class="small" text-anchor="middle" x="465" y="168">Gateway URL + shared secret</text>
  <text class="small" text-anchor="middle" x="465" y="190">zero upstream credentials</text>

  <rect class="gateway" x="300" y="255" width="330" height="190"/>
  <text class="label" text-anchor="middle" x="465" y="290">Loopback Gateway</text>
  <text class="small" text-anchor="middle" x="465" y="318">strict-loopback + bearer gate</text>
  <text class="small" text-anchor="middle" x="465" y="344">profile / binding / allowlist gates</text>
  <text class="small" text-anchor="middle" x="465" y="370">model + MCP credentials inside boundary</text>
  <text class="small" text-anchor="middle" x="465" y="396">resource + budget + usage controls</text>
  <text class="small" text-anchor="middle" x="465" y="422">freshness and result trust gates</text>

  <rect class="box" x="70" y="520" width="205" height="78"/>
  <text class="label" text-anchor="middle" x="172" y="551">Repository</text>
  <text class="small" text-anchor="middle" x="172" y="579">working tree evidence</text>

  <rect class="box" x="330" y="520" width="270" height="78"/>
  <text class="label" text-anchor="middle" x="465" y="551">Redis / TimeSeries</text>
  <text class="small" text-anchor="middle" x="465" y="579">state + usage ledger</text>

  <rect class="trace" x="650" y="520" width="170" height="78"/>
  <text class="label" text-anchor="middle" x="735" y="551">Phoenix</text>
  <text class="small" text-anchor="middle" x="735" y="579">OTLP collector / UI</text>

  <rect class="external" x="910" y="90" width="430" height="92"/>
  <text class="label" text-anchor="middle" x="1125" y="123">Approved model aggregator</text>
  <text class="small" text-anchor="middle" x="1125" y="151">model routing + provider usage/cost</text>

  <rect class="external" x="910" y="235" width="430" height="92"/>
  <text class="label" text-anchor="middle" x="1125" y="268">Remote MCP server</text>
  <text class="small" text-anchor="middle" x="1125" y="296">Gateway-owned Streamable HTTP profile</text>

  <rect class="external" x="910" y="380" width="430" height="92"/>
  <text class="label" text-anchor="middle" x="1125" y="413">Local MCP child</text>
  <text class="small" text-anchor="middle" x="1125" y="441">Docker digest + safe credential projection</text>

  <rect class="catalog" x="910" y="535" width="430" height="92"/>
  <text class="label" text-anchor="middle" x="1125" y="568">Curated MCP catalog</text>
  <text class="small" text-anchor="middle" x="1125" y="596">operator reference only; no data-plane edge</text>

  <path class="edge" d="M275 154 H330"/>
  <path class="edge" d="M465 205 V255"/>
  <path class="edge" d="M300 559 H275"/>
  <path class="edge" d="M465 445 V520"/>
  <path class="edge" d="M630 405 H735 V520"/>
  <path class="edge" d="M630 300 H760 V136 H910"/>
  <path class="edge" d="M630 345 H800 V281 H910"/>
  <path class="edge" d="M630 390 H840 V426 H910"/>
  <path class="catalog-edge" d="M275 180 H700 V581 H910"/>
  <text class="small" text-anchor="middle" x="700" y="650">operator consults catalog</text>
  <text class="small" text-anchor="middle" x="690" y="490">OTLP</text>
</svg>
