name: Work tracking impact

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  # The job id stays `verify`: it is the required status-check context on main.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python
        run: uv python install 3.14

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Record changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only --no-renames --diff-filter=ACMRD "$BASE_SHA"...HEAD > "$RUNNER_TEMP/work-tracking-changed-files.txt"

      - name: Verify the work tracking impact declaration
        run: >-
          uv run --frozen python tools/verify_masterplan_impact.py
          --event-file "$GITHUB_EVENT_PATH"
          --changed-files-file "$RUNNER_TEMP/work-tracking-changed-files.txt"
          --root .

      - name: Test the verifier
        run: uv run --frozen pytest tests/unit/tools/test_verify_masterplan_impact.py -q
