name: guardrails

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-environment-recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: "optimus-check: noneditable-package"
        run: |
          uv build --wheel --out-dir dist/plan99
          uv run python tools/verify_plan99_noneditable_install.py \
            --wheel-dir dist/plan99 \
            --scratch-root "${RUNNER_TEMP}/optimus-plan99-package"

      - name: "optimus-check: hygiene"
        run: |
          uv run pre-commit run trailing-whitespace --all-files
          uv run pre-commit run check-yaml --all-files
          uv run pre-commit run check-toml --all-files
          uv run pre-commit run check-added-large-files --all-files

      - name: "optimus-check: ruff"
        run: uv run ruff check .

      - name: "optimus-check: bandit"
        run: uv run bandit -q -r src -c pyproject.toml

      - name: "optimus-check: ast-grep"
        run: uv run pre-commit run optimus-ast-grep --all-files

      - name: "optimus-check: config-trust-scan"
        run: uv run python -m optimus.guardrails.prompt_injection

      - name: "optimus-check: secret-scan"
        run: |
          uv run python -X utf8 - <<'PY'
          import os
          import subprocess
          from identify.identify import tags_from_path

          raw = subprocess.check_output(["git", "ls-files", "-z", "--", "src/"])
          paths = [os.fsdecode(path) for path in raw.split(b"\0") if path]
          text_paths = [path for path in paths if "text" in tags_from_path(path)]
          if not text_paths:
              raise SystemExit("No tracked production text files under src/")
          print(f"Tracked production text files: {len(text_paths)}")
          PY
          uv run pre-commit run optimus-secret-scan-ci-production --all-files --hook-stage manual

      # Plan 12.2 closure: one full default run, then separate floors on that dataset (Optimus product
      # group, context_engine and optimus_model_policy at 80% each; Evidence Handoff and the aggregate
      # informational). The commit hook keeps its interim entry until the profiles lane lands.
      # The same dataset is also exported as coverage JSON (per-file rows for the safety comparison).
      - name: "optimus-check: pytest-coverage"
        run: uv run python tools/check_product_coverage.py --run-full-suite --groups tools/product-coverage-groups.json --report-json "${RUNNER_TEMP}/product-coverage/product-coverage-report.json" --coverage-json "${RUNNER_TEMP}/product-coverage/coverage.json"

      # Keep the gate's report, run record, coverage JSON and the run-context terminal records (the full
      # session is verified from them) for every run, failed runs included: the report keeps its real
      # verdict. A gate that stopped before pytest leaves no record, so the copy fails and that run is no
      # comparison evidence; a run that left nothing to upload fails at the upload as well.
      - name: Keep the full run's run-context records
        if: ${{ !cancelled() }}
        run: mkdir -p "${RUNNER_TEMP}/product-coverage/test-runs" && cp --parents tmp/test-runs/*/run.json "${RUNNER_TEMP}/product-coverage/test-runs/"

      - name: Upload product coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/product-coverage/
          if-no-files-found: error
